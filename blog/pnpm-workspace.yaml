packages:
  - apps/*
  - packages/*

# 公開から 7 日未満のバージョンは入れない（単位は分）
minimumReleaseAge: 10080

# install script は名指しで決める。@parcel/watcher は @pandacss/cli の依存。
# 拒否したままで、ビルドと開発サーバーが動くことを確かめた。
# esbuild は storybook の依存。バイナリはプラットフォーム別のパッケージで入り、
# install script は無くても動く（拒否したままで Storybook の起動とテストを確かめた）
# workerd は wrangler の依存。バイナリはプラットフォーム別のパッケージで入る。
# install script は、そのパッケージが入らなかったときの取り直し
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  workerd: false

# Node と pnpm の版は Vite+ が .node-version と packageManager から選ぶ（https://viteplus.dev/guide/env）。
# pnpm が自分で別の版を取りに行かないよう、どちらも ignore にする
pmOnFail: ignore
runtimeOnFail: ignore

# 意図した peer の不一致だけを許可する。vite-plus を上げたら、ここの版も合わせる
peerDependencyRules:
  allowedVersions:
    # vite は overrides で vite-plus-core（中身は vite 8 系）に差し替えている。版番号だけが vite の範囲から外れる
    vite: "1.6.0"
    # storybook の vite-plus は optional peer。10.6.8 と 11.0.0-beta.3 でも 1.x を含まない
    storybook>vite-plus: "1.6.0"

# Vite+ の指定どおり、vite と vitest を同梱の版に向ける。
# 版は `pnpm exec vp toolchain vite-plus-core` と `pnpm exec vp toolchain vitest` の出力に合わせる
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.6.0"
  "vitest@*": "5.1.0"
