name: blog VRT

on:
  push:
    branches: [main]
    paths:
      - "blog/packages/ui/**"
      - "blog/pnpm-lock.yaml"
      - "blog/package.json"
      - "blog/.node-version"
      - "blog/pnpm-workspace.yaml"
      - ".github/workflows/blog-vrt.yml"
  pull_request:
    paths:
      - "blog/packages/ui/**"
      - "blog/pnpm-lock.yaml"
      - "blog/package.json"
      - "blog/.node-version"
      - "blog/pnpm-workspace.yaml"
      - ".github/workflows/blog-vrt.yml"

permissions:
  contents: read

concurrency:
  group: blog-vrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: blog
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]
      - uses: k35o/storybook-addon-vrt@38c7b454862dd4bed704f9878c16450f9673a9a8 # v0 (storybook-addon-vrt@0.4.2)
        with:
          working-directory: blog/packages/ui
          run-args: -- --config vitest.storybook.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: blog/packages/ui/.vrt
          include-hidden-files: true
          overwrite: true
          if-no-files-found: ignore
